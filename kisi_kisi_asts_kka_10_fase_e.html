<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Indikator Birulogi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: #020617;
            background-image: radial-gradient(circle at top right, #1e3a8a, transparent), 
                              radial-gradient(circle at bottom left, #0f172a, transparent);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: 'Inter', sans-serif;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.2s ease;
        }
        .glass-card:hover {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.5);
            transform: scale(1.03);
            cursor: pointer;
        }
        .swal2-popup {
            background: rgba(15, 23, 42, 0.95) !important;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: #fff !important;
            border-radius: 1.5rem !important;
        }
    </style>
</head>
<body class="text-slate-200 p-4 md:p-10">

    <header class="max-w-6xl mx-auto w-full mb-10">
        <div class="flex items-center gap-4 mb-2">
            <div class="h-1 w-12 bg-blue-500 rounded-full"></div>
            <span class="text-blue-400 font-bold tracking-widest text-xs uppercase">Informatika & KKA</span>
        </div>
        <h1 class="text-3xl font-black text-white">GRID <span class="text-blue-500">KISI-KISI</span></h1>
        <p class="text-slate-400 text-sm mt-1">Klik pada kotak untuk menampilkan detail indikator Peserta Didik.</p>
    </header>

    <main id="gridContainer" class="max-w-6xl mx-auto w-full grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4">
        </main>

    <footer class="mt-auto pt-12 pb-8 text-center text-slate-600 text-[10px] tracking-[0.4em] uppercase">
        Platform Edukasi — <span class="text-blue-500 font-bold">birulogi</span>
    </footer>

    <script>
        const data = [
            { judul: "Definisi Algoritma", kisi: "Disajikan pertanyaan tentang langkah penyelesaian masalah, Peserta Didik dapat mengidentifikasi definisi istilah yang merujuk pada langkah sistematis tersebut." },
            { judul: "Peran Algoritma Dasar", kisi: "Disajikan soal mengenai tahapan awal pemrograman, Peserta Didik dapat menentukan posisi algoritma sebagai landasan sebelum masuk ke implementasi yang lebih rumit." },
            { judul: "Format IPO", kisi: "Disajikan ilustrasi penyajian data, Peserta Didik dapat mengidentifikasi format tabel yang memisahkan bagian masukan, pengolahan, dan hasil keluaran." },
            { judul: "Desain Algoritma", kisi: "Disajikan kriteria alur kerja, Peserta Didik dapat menentukan karakteristik desain yang baik agar solusi dapat dicapai secara tepat dan terstruktur." },
            { judul: "Tujuan Penyajian", kisi: "Disajikan berbagai metode dokumentasi alur (naratif, kode semu, diagram alir), Peserta Didik dapat menentukan tujuan utama dari penggunaan berbagai bentuk penyajian tersebut." },
            { judul: "Berpikir Komputasional", kisi: "Disajikan soal mengenai penguatan logika dasar, Peserta Didik dapat menentukan hubungannya dengan kemampuan memecahkan masalah secara komputasi." },
            { judul: "Etimologi Logika", kisi: "Disajikan asal-usul istilah dari bahasa Yunani, Peserta Didik dapat menyebutkan makna harfiah dari akar kata tersebut." },
            { judul: "Definisi Program", kisi: "Disajikan deskripsi tentang sekumpulan instruksi yang dijalankan komputer, Peserta Didik dapat mengidentifikasi istilah teknis untuk kumpulan instruksi tersebut." },
            { judul: "Logika Pemrograman", kisi: "Disajikan soal mengenai prinsip kerja perangkat lunak, Peserta Didik dapat mengidentifikasi konsep yang digunakan untuk menyelesaikan masalah melalui baris perintah." },
            { judul: "Peran Pengembang", kisi: "Disajikan kasus penulisan kode, Peserta Didik dapat menentukan manfaat penerapan logika yang baik bagi pengembang dalam proses pemeliharaan kode." },
            { judul: "Sequence Logic", kisi: "Disajikan skenario eksekusi perintah, Peserta Didik dapat menjelaskan prinsip urutan jalannya instruksi dari awal hingga akhir." },
            { judul: "Selection Logic", kisi: "Disajikan kondisi tertentu dalam sebuah alur, Peserta Didik dapat mengidentifikasi fungsi logika yang digunakan untuk mengambil keputusan berdasarkan syarat yang ada." },
            { judul: "Langkah Debugging", kisi: "Disajikan situasi ketika terjadi kesalahan logika, Peserta Didik dapat menentukan tindakan yang paling efektif untuk menemukan solusi berdasarkan konsep dasar." },
            { judul: "Penerapan Algoritma Harian", kisi: "Disajikan kasus instruksi perakitan barang, Peserta Didik dapat menganalisis hubungan antara mengikuti panduan tertulis dengan prinsip dasar algoritma." },
            { judul: "Analisis Proses (Rata-rata)", kisi: "Disajikan rancangan perhitungan matematika sederhana, Peserta Didik dapat menentukan urutan operasi aritmatika yang benar untuk mendapatkan hasil yang diinginkan." },
            { judul: "Analisis Kondisi Jalur", kisi: "Disajikan beberapa variabel kendala (waktu dan sarana), Peserta Didik dapat menganalisis keputusan yang paling tepat jika semua kondisi tersebut terjadi secara bersamaan." },
            { judul: "Urutan Logis", kisi: "Disajikan daftar aktivitas sekolah yang acak, Peserta Didik dapat menyusun kembali alur tersebut menjadi rangkaian yang logis dan efisien." },
            { judul: "Logika Perulangan", kisi: "Disajikan kasus pekerjaan yang dilakukan berkali-kali, Peserta Didik dapat menentukan prinsip logika yang paling efisien untuk meminimalkan penulisan instruksi." },
            { judul: "Dampak Alur Salah", kisi: "Disajikan skema alur kerja yang tidak berurutan, Peserta Didik dapat menganalisis konsekuensi yang terjadi pada keluaran sistem jika langkah-langkahnya tertukar." },
            { judul: "Hasil Logika Seleksi", kisi: "Disajikan sebuah aturan atau ambang batas nilai, Peserta Didik dapat memprediksi status akhir yang dihasilkan sistem berdasarkan data masukan yang diberikan." },
            { judul: "Labeling Kalimat", kisi: "Disajikan beberapa jenis kalimat dalam konteks pemrograman, Peserta Didik dapat mengkategorikan jenis kalimat tersebut berdasarkan struktur dan fungsinya." },
            { judul: "Prosedur Surat Izin", kisi: "Disajikan langkah-langkah pembuatan dokumen formal, Peserta Didik dapat menentukan prosedur validasi yang harus diletakkan pada bagian penutup." },
            { judul: "Evaluasi Alur Python", kisi: "Disajikan potongan kode Python mengenai aktivitas tertentu, Peserta Didik dapat mengevaluasi dan memperbaiki letak kesalahan baris program agar alurnya menjadi logis." },
            { judul: "Case Sensitivity Python", kisi: "Disajikan kode program yang tidak berjalan karena kesalahan tipografi, Peserta Didik dapat mengevaluasi perbedaan penulisan huruf besar dan kecil pada perintah dasar." },
            { judul: "Analisis Hasil Output", kisi: "Disajikan kode Python dengan variabel kondisi, Peserta Didik dapat menganalisis hasil yang akan muncul di layar berdasarkan nilai yang tersimpan dalam variabel tersebut." },
            { judul: "Evaluasi Operator Logika", kisi: "Disajikan ketidaksesuaian antara hasil program dengan aturan yang diinginkan, Peserta Didik dapat mengevaluasi kesalahan pada simbol pembanding yang digunakan." },
            { judul: "Rancangan Sintaks IF", kisi: "Disajikan beberapa pilihan penulisan kode, Peserta Didik dapat menentukan sintaks penulisan percabangan yang paling tepat dalam bahasa Python." },
            { judul: "Evaluasi Aritmatika", kisi: "Disajikan kode perhitungan yang memberikan hasil tidak akurat, Peserta Didik dapat mengevaluasi penggunaan tanda kurung untuk mengatur prioritas operasi matematika." },
            { judul: "Evaluasi Operator Simbol", kisi: "Disajikan kesalahan sintaks pada bagian pengecekan kesamaan nilai, Peserta Didik dapat mengevaluasi perbedaan antara operator penugasan (pemberian nilai) dan operator perbandingan." },
            { judul: "Rancangan Method String", kisi: "Disajikan kode Python yang belum lengkap, Peserta Didik dapat menentukan metode manipulasi teks yang tepat untuk mendeteksi karakter spesifik di akhir kalimat." }
        ];
    
        const container = document.getElementById('gridContainer');
    
        data.forEach((item, index) => {
            const gridItem = document.createElement('div');
            gridItem.className = 'glass-card p-4 rounded-xl flex flex-col justify-center items-center text-center';
            gridItem.innerHTML = `
                <span class="text-[10px] text-blue-400 font-mono mb-1 opacity-60">ID-${String(index + 1).padStart(2, '0')}</span>
                <h3 class="text-xs md:text-sm font-bold leading-tight text-white uppercase tracking-tight">${item.judul}</h3>
            `;
            
            gridItem.onclick = () => {
                Swal.fire({
                    title: `<span style="color:#60a5fa; font-size:18px;">${item.judul}</span>`,
                    html: `<div style="text-align:left; font-size:14px; line-height:1.6; color:#cbd5e1;"><b>Indikator Kompetensi:</b><br>${item.kisi}</div>`,
                    confirmButtonText: 'Tutup',
                    confirmButtonColor: '#2563eb',
                });
            };
            
            container.appendChild(gridItem);
        });
    </script>
</body>
</html>
